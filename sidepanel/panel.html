<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageGuide</title>
  <link rel="stylesheet" href="panel.css">
  <link rel="stylesheet" href="study.css">
</head>
<body>
  <div class="pageguide-panel">

    <!-- User Study mini-bar (shown while a study task is running so the chat stays usable) -->
    <div class="study-mini-bar" id="study-mini-bar" style="display:none;"></div>

    <!-- User Study overlay (welcome/setup/answer/summary screens) -->
    <div class="study-overlay" id="study-overlay" style="display:none;"></div>

    <!-- History overlay (covers whole panel when visible) -->
    <div class="pageguide-history-overlay" id="pageguide-history" style="display:none;">
      <div class="pageguide-history-hdr">
        <button class="pageguide-history-nav-btn" id="pageguide-history-back" style="visibility:hidden;">← Back</button>
        <span class="pageguide-history-hdr-title" id="pageguide-history-hdr-title">Chat History</span>
        <button class="pageguide-history-nav-btn" id="pageguide-history-close">✕</button>
      </div>
      <div class="pageguide-history-body" id="pageguide-history-body"></div>
    </div>

    <!-- Branch Tree Backdrop -->
    <div class="pageguide-branch-backdrop" id="pageguide-branch-backdrop" style="display:none;"></div>

    <!-- Branch Tree overlay (covers 80% of screen when visible) -->
    <div class="pageguide-branch-overlay" id="pageguide-branch-overlay" style="display:none;">
      <div class="pageguide-branch-hdr">
        <span class="pageguide-branch-hdr-title">Diverted Journeys</span>
        <div class="pg-tree-zoom-controls">
          <button type="button" class="pg-zoom-btn" id="pg-zoom-out" title="Zoom Out">-</button>
          <span class="pg-zoom-label" id="pg-zoom-label">100%</span>
          <button type="button" class="pg-zoom-btn" id="pg-zoom-in" title="Zoom In">+</button>
          <button type="button" class="pg-zoom-btn" id="pg-zoom-reset" title="Reset Zoom">↺</button>
        </div>
        <button class="pageguide-branch-close-btn" id="pageguide-branch-close" title="Close" aria-label="Close branch panel">✕</button>
      </div>
      <div class="pageguide-branch-body" id="pageguide-branch-body"></div>
    </div>

    <!-- Header -->
    <div class="pageguide-chat-header">
      <div class="pageguide-header-right">
        <button class="pageguide-icon-btn" id="pageguide-theme-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode"></button>
        <button class="pageguide-icon-btn" id="pageguide-open-history" title="Chat History" aria-label="Chat History">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
        </button>
        <button class="pageguide-icon-btn" id="pageguide-new-chat" title="New Chat" aria-label="New Chat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button class="pageguide-icon-btn" id="pageguide-save-chat" title="Save current chat to history" aria-label="Save current chat to history">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
        </button>
        <button class="pageguide-icon-btn" id="pageguide-settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 1 1 4.2 17l.1-.1A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7A2 2 0 1 1 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 1 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1a2 2 0 1 1 0 4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
        </button>
      </div>
    </div>

    <!-- The goal/"View Journey" card is now created dynamically INSIDE #pageguide-messages
         (see ensureGoalCardMessage() in panel.js) so it appears inline in the chat, at the
         position where the guide's work started — right where the typing indicator would
         otherwise sit — instead of as a separate fixed card above the conversation. -->

    <!-- Current guide step panel (updates in place; history lives in the Journey) -->
    <div class="pageguide-step-panel" id="pageguide-step-panel" style="display:none;"></div>

    <!-- Scroll area: Journey (injected by rewind_timeline.js) + chat messages -->
    <div class="pageguide-chat-messages" id="pageguide-messages"></div>

    <div class="pageguide-chat-input-area">
      <!-- Unified attachment chip row (image / file / selected-text).
           renderAttachmentChips() in panel.js toggles the image chip and (re)builds
           the dynamic file/text chips. Hidden when nothing is attached. -->
      <div class="pageguide-attachment-chips" id="pageguide-attachment-chips" style="display: none;">
        <!-- Image chip is static so its wrapper survives region-overlay injection
             (renderImageRegions), which promotes it to a full-width view. -->
        <div class="pageguide-attachment-chip pageguide-chip-image" id="pageguide-image-chip" style="display: none;">
          <div class="pageguide-image-wrapper" id="pageguide-image-wrapper">
            <img id="pageguide-preview-img" src="" alt="Uploaded image">
            <!-- clickable region overlays injected here by JS -->
          </div>
          <div class="pageguide-chip-info">
            <span class="pageguide-chip-name" id="pageguide-image-name">Image</span>
            <span class="pageguide-chip-meta" id="pageguide-image-label">📷 Ready — ask about it</span>
          </div>
          <button class="pageguide-remove-image" id="pageguide-remove-image" title="Remove image">✕</button>
        </div>
        <!-- file & selected-text chips are appended here by renderAttachmentChips() -->
      </div>

      <!-- Slash command autocomplete dropdown -->
      <div class="pageguide-slash-menu" id="pageguide-slash-menu" style="display:none;"></div>

      <div class="pageguide-input-shell">
        <div class="pageguide-tab-chip" id="pageguide-tab-chip" style="display:none;">
          <img class="pageguide-tab-chip-favicon" id="pageguide-tab-chip-favicon" alt="">
          <span class="pageguide-tab-chip-title" id="pageguide-tab-chip-title"></span>
          <button type="button" class="pageguide-tab-chip-close" id="pageguide-tab-chip-close" title="Hide tab label" aria-label="Hide tab label">×</button>
        </div>

        <div class="pageguide-input-row">
          <textarea class="pageguide-chat-input" id="pageguide-input" placeholder="Ask anything... (type / for commands)" rows="3"></textarea>
        </div>

        <div class="pageguide-input-actions">
          <label class="pageguide-upload-btn" id="pageguide-upload-label" title="Add files (image or text, or Ctrl+V to paste image)">
            <span id="pageguide-upload-icon" class="pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.4 11.6-8.8 8.8a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></span>
            <input type="file" id="pageguide-image-upload" accept="image/*,.txt,.md,.csv,.json,.xml,.yaml,.yml,.html,.htm,.py,.js,.ts,.css,.log" hidden>
          </label>

          <!-- Secondary actions kept near attachment controls so the chat box stays clean. -->
          <div class="pageguide-action-bar">
            <button class="pageguide-quick-btn" data-action="reset" title="Clear chat and highlights"><span class="pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 15 6-6"/><path d="m8 19 7-7"/><path d="M14 5l5 5"/><path d="m3 21 5-2 11-11-3-3L5 16Z"/></svg></span>Clear</button>
            <button type="button" class="pageguide-quick-btn" id="pageguide-show-branch-btn" title="Show branch tree visualizer" style="display:none;">
              <span class="pageguide-inline-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="6" y1="3" x2="6" y2="15"></line>
                  <circle cx="18" cy="6" r="3"></circle>
                  <circle cx="6" cy="18" r="3"></circle>
                  <path d="M18 9a9 9 0 0 1-9 9"></path>
                </svg>
              </span>Show branch
            </button>
          </div>

          <!-- Manual vs Autonomous mode selector (opens a menu with descriptions) -->
          <div class="pageguide-mode-wrap">
            <button class="pageguide-mode-btn" id="pageguide-mode-toggle" title="Choose how the agent acts"><span class="pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 11V7a2 2 0 0 0-4 0v4"/><path d="M14 10V5a2 2 0 0 0-4 0v7"/><path d="M10 11V6a2 2 0 0 0-4 0v8"/><path d="M6 14v-2a2 2 0 0 0-4 0v3a7 7 0 0 0 7 7h4a7 7 0 0 0 7-7v-4a2 2 0 0 0-2-2Z"/></svg></span>Manual ▾</button>
            <div class="pageguide-mode-menu" id="pageguide-mode-menu" style="display:none;">
              <button class="pageguide-mode-option" data-mode="manual">
                <span class="pageguide-mode-opt-icon pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 11V7a2 2 0 0 0-4 0v4"/><path d="M14 10V5a2 2 0 0 0-4 0v7"/><path d="M10 11V6a2 2 0 0 0-4 0v8"/><path d="M6 14v-2a2 2 0 0 0-4 0v3a7 7 0 0 0 7 7h4a7 7 0 0 0 7-7v-4a2 2 0 0 0-2-2Z"/></svg></span>
                <span class="pageguide-mode-opt-text"><b>Manual</b><small>You do each step yourself. The agent guides but never acts on its own.</small></span>
              </button>
              <button class="pageguide-mode-option" data-mode="auto">
                <span class="pageguide-mode-opt-icon pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7Z"/></svg></span>
                <span class="pageguide-mode-opt-text"><b>Auto: Ask</b><small>The agent acts on routine steps and pauses for confirmation or sensitive actions.</small></span>
              </button>
              <button class="pageguide-mode-option" data-mode="auto_no_ask">
                <span class="pageguide-mode-opt-icon pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7Z"/><path d="m4 4 16 16"/></svg></span>
                <span class="pageguide-mode-opt-text"><b>Auto: No Ask</b><small>The agent bypasses risk and confirmation pauses, while confidence and loop guards stay on.</small></span>
              </button>
            </div>
          </div>

          <!-- Non-grounding baseline mode: always visible (not debug-only) — a user-study A/B
               toggle. Same routing/answers, but no on-page highlighting, marker overlays, or
               visual-highlight screenshots when set to Non-grounding. -->
          <div class="pageguide-mode-wrap pageguide-nongrounding-wrap">
            <button class="pageguide-mode-btn" id="pageguide-nongrounding-toggle" title="Toggle the Non-grounding baseline (no on-page highlighting)"><span class="pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h4Z"/><path d="M13 5h4a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2h-4Z"/><path d="M13 5v16"/></svg></span>Grounding: On ▾</button>
            <div class="pageguide-mode-menu" id="pageguide-nongrounding-menu" style="display:none;">
              <button class="pageguide-mode-option" data-nongrounding="off">
                <span class="pageguide-mode-opt-text"><b>Grounding On</b><small>Default. Find/Ask/Guide answers highlight the supporting evidence on the page.</small></span>
              </button>
              <button class="pageguide-mode-option" data-nongrounding="on">
                <span class="pageguide-mode-opt-text"><b>Non-grounding (baseline)</b><small>Plain text answers only — no highlights, markers, or visual-evidence screenshots. For A/B baseline comparison.</small></span>
              </button>
            </div>
          </div>

          <!-- Visual input mode (debug-only): send a screenshot for the same 5000-element Guide index. -->
          <div class="pageguide-mode-wrap pageguide-visualinput-wrap" style="display:none;">
            <button class="pageguide-mode-btn" id="pageguide-visualinput-toggle" title="Send a marked screenshot with Guide step prompts"><span class="pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 21 21 8"/><path d="M15 3h6v6"/><circle cx="8.5" cy="8.5" r="1.5"/></svg></span>Visual: Off ▾</button>
            <div class="pageguide-mode-menu" id="pageguide-visualinput-menu" style="display:none;">
              <button class="pageguide-mode-option" data-visualinput="on">
                <span class="pageguide-mode-opt-text"><b>Visual On</b><small>Send the Guide LLM a screenshot with up to 5000 numbered SoM markers.</small></span>
              </button>
              <button class="pageguide-mode-option" data-visualinput="off">
                <span class="pageguide-mode-opt-text"><b>Visual Off</b><small>Use the same 5000-element PAGE INDEX without a screenshot.</small></span>
              </button>
            </div>
          </div>

          <!-- End Summary Agent (debug-only): run the extra summarizer/diagnostic agent at task end. -->
          <div class="pageguide-mode-wrap pageguide-summaryagent-wrap" style="display:none;">
            <button class="pageguide-mode-btn" id="pageguide-summaryagent-toggle" title="Run the extra summary agent after a guide task ends"><span class="pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16"/><path d="M4 12h12"/><path d="M4 19h8"/><path d="m17 16 2 2 4-4"/></svg></span>Summary: Off ▾</button>
            <div class="pageguide-mode-menu" id="pageguide-summaryagent-menu" style="display:none;">
              <button class="pageguide-mode-option" data-summaryagent="on">
                <span class="pageguide-mode-opt-text"><b>Summary On</b><small>Run the extra end-of-task summarizer/diagnostic agent.</small></span>
              </button>
              <button class="pageguide-mode-option" data-summaryagent="off">
                <span class="pageguide-mode-opt-text"><b>Summary Off</b><small>Finish without the extra end summarization call.</small></span>
              </button>
            </div>
          </div>

          <!-- Visual Recap mode (debug-only): post an end-of-task recap with hoverable visual evidence. -->
          <div class="pageguide-mode-wrap pageguide-recap-wrap" style="display:none;">
            <button class="pageguide-mode-btn" id="pageguide-recap-toggle" title="Post a visual recap with screenshot evidence when a guide task finishes"><span class="pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg></span>Recap: On ▾</button>
            <div class="pageguide-mode-menu" id="pageguide-recap-menu" style="display:none;">
              <button class="pageguide-mode-option" data-recap="on">
                <span class="pageguide-mode-opt-text"><b>Recap On</b><small>When a task finishes, summarize what was done with hoverable screenshot evidence (default).</small></span>
              </button>
              <button class="pageguide-mode-option" data-recap="off">
                <span class="pageguide-mode-opt-text"><b>Recap Off</b><small>End the task on the final step without a recap message.</small></span>
              </button>
            </div>
          </div>

          <div class="pageguide-menu-wrap" id="pageguide-more-wrap">
            <button class="pageguide-quick-btn pageguide-more-btn" id="pageguide-more-btn" title="More">⋯</button>
            <div class="pageguide-menu" id="pageguide-more-menu" style="display:none;">
              <button class="pageguide-menu-item" id="pageguide-no-page-ctx" title="Toggle: answer from AI knowledge only (ignore current page)"><span class="pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20"/><path d="M12 2a15 15 0 0 0 0 20"/></svg></span>Page: On</button>
              <button class="pageguide-menu-item pageguide-pdf-reader-btn" id="pageguide-pdf-reader"><span class="pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/></svg></span>Open PDF reader</button>
              <button class="pageguide-menu-item" id="pageguide-open-study" title="Run the Find/Guide user study"><span class="pageguide-inline-icon">📋</span>User Study</button>
            </div>
          </div>

          <button type="button" class="pageguide-quick-btn" id="pageguide-debug-prompt-btn" title="View last prompt sent to agent" style="display:none;">🐞 Prompt</button>
          <button type="button" class="pageguide-guide-pause-btn" id="pageguide-guide-pause" title="Pause guide" aria-label="Pause guide" style="display:none;">Pause</button>
          <button type="button" class="pageguide-guide-pause-btn pageguide-guide-stop-paused-btn" id="pageguide-guide-stop-paused" title="Stop guide and summarize" aria-label="Stop guide and summarize" style="display:none;">Stop</button>
          <button class="pageguide-send-btn" id="pageguide-send">➤</button>
        </div>
      </div>

      <!-- Footer disclaimer -->
      <div class="pageguide-footer">
        <span class="pageguide-footer-text">PageGuide can make mistakes</span>
        <button class="pageguide-info-btn" id="pageguide-info" title="About PageGuide" aria-label="About PageGuide">
          <span class="pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></span>
        </button>
        <div class="pageguide-info-pop" id="pageguide-info-pop" style="display:none;">
          PageGuide uses AI and can be wrong — review its steps, and double-check anything sensitive or irreversible before acting.
        </div>
      </div>
    </div>
  </div>
  <script src="../content/prompts.js"></script>
  <script src="../rewind/rewind_store.js"></script>
  <!-- Pure gv2* helpers (gv2DotState, etc.) shared with the content script. -->
  <script src="../content/utils.js"></script>
  <script src="rewind_timeline.js"></script>
  <script src="panel.js"></script>
  <!-- Optional, gitignored — defines SUPABASE_URL/SUPABASE_ANON_KEY for study.js.
       See supabase_config.example.js. Safe to leave as placeholders (study.js checks for that). -->
  <script src="supabase_config.js"></script>
  <script src="study.js"></script>
</body>
</html>
