<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageGuide</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <div class="pageguide-panel">

    <!-- History overlay (covers whole panel when visible) -->
    <div class="pageguide-history-overlay" id="pageguide-history" style="display:none;">
      <div class="pageguide-history-hdr">
        <button class="pageguide-history-nav-btn" id="pageguide-history-back" style="visibility:hidden;">← Back</button>
        <span class="pageguide-history-hdr-title" id="pageguide-history-hdr-title">Chat History</span>
        <button class="pageguide-history-nav-btn" id="pageguide-history-close">✕</button>
      </div>
      <div class="pageguide-history-body" id="pageguide-history-body"></div>
    </div>

    <!-- Header -->
    <div class="pageguide-chat-header">
      <div class="pageguide-header-right">
        <button class="pageguide-icon-btn" id="pageguide-theme-toggle" title="Toggle light/dark mode" aria-label="Toggle light/dark mode"></button>
        <button class="pageguide-icon-btn" id="pageguide-open-history" title="Chat History" aria-label="Chat History">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg>
        </button>
        <button class="pageguide-icon-btn" id="pageguide-new-chat" title="New Chat" aria-label="New Chat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button class="pageguide-icon-btn" id="pageguide-settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1A2 2 0 1 1 4.2 17l.1-.1A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.6-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7A2 2 0 1 1 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 1 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1a2 2 0 1 1 0 4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg>
        </button>
      </div>
    </div>

    <!-- Goal card (compact summary of the user's prompt) -->
    <div class="pageguide-goal" id="pageguide-goal" style="display:none;">
      <div class="pageguide-goal-icon" id="pageguide-goal-icon">🎯</div>
      <div class="pageguide-goal-main">
        <div class="pageguide-goal-title-row">
          <div class="pageguide-goal-title" id="pageguide-goal-title"></div>
          <span class="pageguide-goal-caret">⌄</span>
          <div class="pageguide-guide-card-actions" id="pageguide-guide-card-actions"></div>
        </div>
        <div class="pageguide-goal-progress" id="pageguide-goal-progress" style="display:none;">
          <span class="pageguide-goal-steptext" id="pageguide-goal-steptext"></span>
          <div class="pageguide-goal-dots" id="pageguide-goal-dots"></div>
          <div class="pageguide-goal-bar"><div class="pageguide-goal-bar-fill" id="pageguide-goal-bar-fill"></div></div>
        </div>
      </div>
    </div>

    <!-- Current guide step panel (updates in place; history lives in the Journey) -->
    <div class="pageguide-step-panel" id="pageguide-step-panel" style="display:none;"></div>

    <!-- Scroll area: Journey (injected by rewind_timeline.js) + chat messages -->
    <div class="pageguide-chat-messages" id="pageguide-messages"></div>

    <div class="pageguide-chat-input-area">
      <!-- Image Preview Area (hidden by default) -->
      <div class="pageguide-image-preview" id="pageguide-image-preview" style="display: none;">
        <div class="pageguide-image-wrapper" id="pageguide-image-wrapper">
          <img id="pageguide-preview-img" src="" alt="Uploaded image">
          <!-- clickable region overlays injected here by JS -->
        </div>
        <div class="pageguide-image-preview-footer">
          <span class="pageguide-image-label" id="pageguide-image-label">📷 Image ready - ask about it!</span>
          <button class="pageguide-remove-image" id="pageguide-remove-image" title="Remove image">✕</button>
        </div>
      </div>

      <!-- Slash command autocomplete dropdown -->
      <div class="pageguide-slash-menu" id="pageguide-slash-menu" style="display:none;"></div>

      <!-- File Preview Area (hidden by default) -->
      <div class="pageguide-file-preview" id="pageguide-file-preview" style="display: none;">
        <span class="pageguide-file-label" id="pageguide-file-label">📎 File attached</span>
        <button class="pageguide-remove-image" id="pageguide-remove-file" title="Remove file">✕</button>
      </div>

      <!-- Selected Text Preview Area (hidden by default) -->
      <div class="pageguide-selected-text-preview" id="pageguide-selected-text-preview" style="display: none;">
        <span class="pageguide-selected-text-label" id="pageguide-selected-text-label">📝 Text selected</span>
        <button class="pageguide-remove-image" id="pageguide-remove-selected-text" title="Clear selection context">✕</button>
      </div>

      <div class="pageguide-input-shell">
      <div class="pageguide-input-row">
        <textarea class="pageguide-chat-input" id="pageguide-input" placeholder="Ask anything... (type / for commands)" rows="3"></textarea>
      </div>

      <div class="pageguide-input-actions">
        <label class="pageguide-upload-btn" id="pageguide-upload-label" title="Add files (image or text, or Ctrl+V to paste image)">
          <span id="pageguide-upload-icon" class="pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.4 11.6-8.8 8.8a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg></span>
          <input type="file" id="pageguide-image-upload" accept="image/*,.txt,.md,.csv,.json,.xml,.yaml,.yml,.html,.htm,.py,.js,.ts,.css,.log" hidden>
        </label>

        <!-- Secondary actions kept near attachment controls so the chat box stays clean. -->
        <div class="pageguide-action-bar">
          <button class="pageguide-quick-btn" data-action="reset" title="Clear chat and highlights"><span class="pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 15 6-6"/><path d="m8 19 7-7"/><path d="M14 5l5 5"/><path d="m3 21 5-2 11-11-3-3L5 16Z"/></svg></span>Clear</button>
        </div>

        <!-- Manual vs Autonomous mode selector (opens a menu with descriptions) -->
        <div class="pageguide-mode-wrap">
          <button class="pageguide-mode-btn" id="pageguide-mode-toggle" title="Choose how the agent acts"><span class="pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 11V7a2 2 0 0 0-4 0v4"/><path d="M14 10V5a2 2 0 0 0-4 0v7"/><path d="M10 11V6a2 2 0 0 0-4 0v8"/><path d="M6 14v-2a2 2 0 0 0-4 0v3a7 7 0 0 0 7 7h4a7 7 0 0 0 7-7v-4a2 2 0 0 0-2-2Z"/></svg></span>Manual ▾</button>
          <div class="pageguide-mode-menu" id="pageguide-mode-menu" style="display:none;">
            <button class="pageguide-mode-option" data-mode="manual">
              <span class="pageguide-mode-opt-icon pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 11V7a2 2 0 0 0-4 0v4"/><path d="M14 10V5a2 2 0 0 0-4 0v7"/><path d="M10 11V6a2 2 0 0 0-4 0v8"/><path d="M6 14v-2a2 2 0 0 0-4 0v3a7 7 0 0 0 7 7h4a7 7 0 0 0 7-7v-4a2 2 0 0 0-2-2Z"/></svg></span>
              <span class="pageguide-mode-opt-text"><b>Manual</b><small>You do each step yourself. The agent guides but never acts on its own.</small></span>
            </button>
            <button class="pageguide-mode-option" data-mode="auto">
              <span class="pageguide-mode-opt-icon pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7Z"/></svg></span>
              <span class="pageguide-mode-opt-text"><b>Autonomous</b><small>The agent completes steps for you and only pauses for high-risk, irreversible actions.</small></span>
            </button>
          </div>
        </div>

        <div class="pageguide-menu-wrap" id="pageguide-more-wrap">
          <button class="pageguide-quick-btn pageguide-more-btn" id="pageguide-more-btn" title="More">⋯</button>
          <div class="pageguide-menu" id="pageguide-more-menu" style="display:none;">
            <button class="pageguide-menu-item" id="pageguide-save-chat" title="Save current chat to history"><span class="pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg></span>Save chat</button>
            <button class="pageguide-menu-item" id="pageguide-no-page-ctx" title="Toggle: answer from AI knowledge only (ignore current page)"><span class="pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15 15 0 0 1 0 20"/><path d="M12 2a15 15 0 0 0 0 20"/></svg></span>Page: On</button>
            <button class="pageguide-menu-item pageguide-guide-only-action" id="pageguide-export-pdf" title="Export the guide journey as a PDF"><span class="pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></span>Export PDF</button>
            <button class="pageguide-menu-item pageguide-pdf-reader-btn" id="pageguide-pdf-reader"><span class="pageguide-inline-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h5"/></svg></span>Open PDF reader</button>
          </div>
        </div>

        <button class="pageguide-send-btn" id="pageguide-send">➤</button>
      </div>
      </div>

      <!-- Footer disclaimer -->
      <div class="pageguide-footer">
        <span class="pageguide-footer-text">PageGuide can make mistakes</span>
        <button class="pageguide-info-btn" id="pageguide-info" title="About PageGuide">ℹ️</button>
        <div class="pageguide-info-pop" id="pageguide-info-pop" style="display:none;">
          PageGuide uses AI and can be wrong — review its steps, and double-check anything sensitive or irreversible before acting.
        </div>
      </div>
    </div>
  </div>
  <script src="../content/prompts.js"></script>
  <script src="../rewind/rewind_store.js"></script>
  <script src="rewind_timeline.js"></script>
  <script src="panel.js"></script>
</body>
</html>
