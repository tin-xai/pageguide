<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageGuide — Step Inspector</title>
  <style>
    :root {
      color-scheme: light;
      --pg-bg: #f7f8fb;
      --pg-panel: rgba(255,255,255,.86);
      --pg-card: #fff;
      --pg-text: #202538;
      --pg-muted: #71788c;
      --pg-border: rgba(120,87,255,.16);
      --pg-hover: #f5f3ff;
      --pg-accent: #7857ff;
      --pg-accent-2: #9a6dff;
      --pg-shadow: 0 18px 48px rgba(44,45,70,.12);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --pg-bg: #101018;
        --pg-panel: rgba(21,21,32,.88);
        --pg-card: #1d1d2a;
        --pg-text: #f4f3ff;
        --pg-muted: #a5a8bb;
        --pg-border: rgba(255,255,255,.12);
        --pg-hover: #282842;
        --pg-accent: #9b84ff;
        --pg-accent-2: #b89cff;
        --pg-shadow: 0 20px 56px rgba(0,0,0,.36);
      }
    }
    body.light-mode {
      color-scheme: light;
      --pg-bg: #f7f8fb;
      --pg-panel: rgba(255,255,255,.86);
      --pg-card: #fff;
      --pg-text: #202538;
      --pg-muted: #71788c;
      --pg-border: rgba(120,87,255,.16);
      --pg-hover: #f5f3ff;
      --pg-accent: #7857ff;
      --pg-accent-2: #9a6dff;
      --pg-shadow: 0 18px 48px rgba(44,45,70,.12);
    }
    body.dark-mode {
      color-scheme: dark;
      --pg-bg: #101018;
      --pg-panel: rgba(21,21,32,.88);
      --pg-card: #1d1d2a;
      --pg-text: #f4f3ff;
      --pg-muted: #a5a8bb;
      --pg-border: rgba(255,255,255,.12);
      --pg-hover: #282842;
      --pg-accent: #9b84ff;
      --pg-accent-2: #b89cff;
      --pg-shadow: 0 20px 56px rgba(0,0,0,.36);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: var(--pg-bg); color: var(--pg-text); }
    header { display: flex; align-items: center; gap: 14px; padding: 14px 20px;
             border-bottom: 1px solid var(--pg-border); position: sticky; top: 0; background: var(--pg-panel); backdrop-filter: blur(18px); z-index: 5; }
    header h1 { font-size: 16px; margin: 0; flex: 1; }
    header select { background: var(--pg-card); color: inherit; border: 1px solid var(--pg-border);
                    border-radius: 7px; padding: 6px 10px; font: inherit; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .why { background: var(--pg-card); border: 1px solid var(--pg-border); border-radius: 10px;
           padding: 14px 16px; margin-bottom: 16px; box-shadow: var(--pg-shadow); }
    .why div { margin: 3px 0; }
    .meta { color: var(--pg-muted); margin-top: 8px; font-size: 13px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab { background: var(--pg-card); color: inherit; border: 1px solid var(--pg-border); border-radius: 8px;
           padding: 8px 14px; font: 600 13px/1 sans-serif; cursor: pointer; display:inline-flex; align-items:center; gap:7px; }
    .tab.active { background: linear-gradient(135deg,var(--pg-accent),var(--pg-accent-2)); color: #fff; border-color: transparent; }
    .tab[disabled] { opacity: .4; cursor: not-allowed; }
    .view img { width: 100%; border-radius: 10px; border: 1px solid var(--pg-border); box-shadow: var(--pg-shadow); }
    .snap-wrap { position: relative; }
    .snap-banner { position: absolute; top: 10px; left: 10px; background: rgba(120,87,255,.92);
                   color: #fff; font: 600 12px/1 sans-serif; padding: 6px 11px; border-radius: 99px; z-index: 2; }
    iframe { width: 100%; height: 78vh; border: 1px solid var(--pg-border); border-radius: 10px; background: #fff; }
    details { margin-top: 16px; }
    summary { cursor: pointer; font-weight: 600; }
    pre { white-space: pre-wrap; word-break: break-word; background: var(--pg-card); border: 1px solid var(--pg-border); padding: 12px;
          border-radius: 8px; overflow: auto; font: 12px/1.5 monospace; }
    .empty { color: var(--pg-muted); padding: 40px; text-align: center; }
    .ico { width:15px; height:15px; display:inline-block; }
    .ico svg { width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; display:block; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Step Inspector</h1>
    <label>Step <select id="step-select"></select></label>
  </header>
  <main id="main">
    <div class="empty" id="empty" style="display:none">No capture record found for this step.</div>
    <div id="content" style="display:none">
      <div class="why" id="why"></div>
      <div class="tabs">
        <button class="tab" id="tab-shot" data-view="shot"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7a2 2 0 0 1 2-2h3l2-2h2l2 2h3a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><circle cx="12" cy="13" r="4"/></svg></span>Screenshot</button>
        <button class="tab" id="tab-snap" data-view="snap"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10"/><path d="M7 12h7"/><path d="M7 16h5"/></svg></span>Page snapshot</button>
      </div>
      <div class="view" id="view"></div>
      <details id="raw-wrap" style="display:none">
        <summary>Raw agent response</summary>
        <pre id="raw"></pre>
      </details>
    </div>
  </main>
  <script src="rewind_store.js"></script>
  <script src="inspector.js"></script>
</body>
</html>
