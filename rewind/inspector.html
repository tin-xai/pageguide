<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PageGuide — Step Inspector</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #14141c; color: #e8e8f0; }
    header { display: flex; align-items: center; gap: 14px; padding: 14px 20px;
             border-bottom: 1px solid rgba(255,255,255,.1); position: sticky; top: 0; background: #14141c; z-index: 5; }
    header h1 { font-size: 16px; margin: 0; flex: 1; }
    header select { background: #222230; color: inherit; border: 1px solid rgba(255,255,255,.15);
                    border-radius: 7px; padding: 6px 10px; font: inherit; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .why { background: #1d1d28; border: 1px solid rgba(255,255,255,.08); border-radius: 10px;
           padding: 14px 16px; margin-bottom: 16px; }
    .why div { margin: 3px 0; }
    .meta { opacity: .7; margin-top: 8px; font-size: 13px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab { background: rgba(255,255,255,.08); color: inherit; border: none; border-radius: 8px;
           padding: 8px 14px; font: 600 13px/1 sans-serif; cursor: pointer; }
    .tab.active { background: #7c5cff; color: #fff; }
    .tab[disabled] { opacity: .4; cursor: not-allowed; }
    .view img { width: 100%; border-radius: 10px; border: 1px solid rgba(255,255,255,.1); }
    .snap-wrap { position: relative; }
    .snap-banner { position: absolute; top: 10px; left: 10px; background: rgba(20,20,30,.88);
                   color: #ffd166; font: 600 12px/1 sans-serif; padding: 6px 11px; border-radius: 99px; z-index: 2; }
    iframe { width: 100%; height: 78vh; border: 1px solid rgba(255,255,255,.1); border-radius: 10px; background: #fff; }
    details { margin-top: 16px; }
    summary { cursor: pointer; font-weight: 600; }
    pre { white-space: pre-wrap; word-break: break-word; background: #0006; padding: 12px;
          border-radius: 8px; overflow: auto; font: 12px/1.5 monospace; }
    .empty { opacity: .6; padding: 40px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Step Inspector</h1>
    <label>Step <select id="step-select"></select></label>
  </header>
  <main id="main">
    <div class="empty" id="empty" style="display:none">No capture record found for this step.</div>
    <div id="content" style="display:none">
      <div class="why" id="why"></div>
      <div class="tabs">
        <button class="tab" id="tab-shot" data-view="shot">📷 Screenshot</button>
        <button class="tab" id="tab-snap" data-view="snap">🧩 Page snapshot</button>
      </div>
      <div class="view" id="view"></div>
      <details id="raw-wrap" style="display:none">
        <summary>Raw agent response</summary>
        <pre id="raw"></pre>
      </details>
    </div>
  </main>
  <script src="rewind_store.js"></script>
  <script src="inspector.js"></script>
</body>
</html>
